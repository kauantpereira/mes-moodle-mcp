name: Sugestão de história
description: Proponha uma nova história de usuário; ela passa pela triagem de conformidade antes de ir para o board
title: "[Sugestão] Como aluno, quero … para …"
labels: ["sugestão"]
body:
  - type: markdown
    attributes:
      value: "Veja os exemplos (issues com label `user story`) e o fluxo em `docs/dev/sugestoes.md`. Não precisa estar perfeita: a triagem ajuda a adaptar."
  - type: textarea
    id: historia
    attributes:
      label: História
      description: "Como <quem>, quero <o quê>, para <por quê>."
    validations: { required: true }
  - type: textarea
    id: exemplo
    attributes:
      label: Um exemplo concreto de uso
      placeholder: "Na segunda de manhã eu pergunto … e o agente …"
    validations: { required: true }
  - type: textarea
    id: dados
    attributes:
      label: Que dados do Moodle ela usaria?
      placeholder: "avisos, prazos, notas, materiais, fóruns…"
  - type: checkboxes
    id: autoavaliacao
    attributes:
      label: Autoavaliação de conformidade (ADRs 0001–0006)
      options:
        - label: Só lê; não envia, publica nem altera nada no Moodle (ADR-0004)
        - label: Usa só dados do próprio aluno (ADR-0004)
        - label: Não guarda cópia do material dos professores (ADR-0003)
        - label: Não exige muitas chamadas seguidas ao Moodle (ADR-0005)
        - label: Respeita as regras de IA de cada disciplina (ADR-0006)
