[project]
name = "moodle-mcp"
version = "0.1.0"
description = "Servidor MCP somente leitura para o Moodle do aluno, com conformidade às regras da instituição"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
moodle-mcp = "moodle_mcp:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
